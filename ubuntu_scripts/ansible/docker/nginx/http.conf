## LAN names for the home server apps: http://<app>.192.168.0.113.nip.io
## nip.io resolves any *.192.168.0.113.nip.io name to 192.168.0.113, so no local DNS is needed.
## Loaded by Nginx Proxy Manager from /data/nginx/custom/http.conf
map $host $home_app_port {
    hostnames;
    plex.192.168.0.113.nip.io         32400;
    sonarr.192.168.0.113.nip.io       8989;
    radarr.192.168.0.113.nip.io       7878;
    prowlarr.192.168.0.113.nip.io     9696;
    bazarr.192.168.0.113.nip.io       6767;
    qbittorrent.192.168.0.113.nip.io  8080;
    portainer.192.168.0.113.nip.io    9002;
    npm.192.168.0.113.nip.io          81;
}

server {
    listen 80;
    server_name *.192.168.0.113.nip.io;

    if ($home_app_port = "") {
        return 404;
    }

    location / {
        proxy_pass http://192.168.0.113:$home_app_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
